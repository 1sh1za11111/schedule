<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule & Task App (予実管理・完全版)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* スタイル設定 */
    body { margin: 0; padding: 0; overflow: hidden; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; background-color: #F4F5F7; }
    
    /* ログイン画面 */
    #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #4F46E5; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
    .login-box h2 { margin-top: 0; color: #1F2937; }
    .login-box input { padding: 10px; font-size: 16px; width: 200px; margin-bottom: 20px; border: 1px solid #E5E7EB; border-radius: 6px; display: block; margin: 10px auto 20px; }
    .login-box button { padding: 10px 30px; background: #10B981; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .login-box button:hover { background: #059669; }
    .error-msg { color: red; font-size: 14px; height: 20px; margin-bottom: 10px; }
    .reset-link { margin-top: 20px; font-size: 12px; color: #ccc; text-decoration: underline; cursor: pointer; }

    /* モーダル */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: white; width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; }
    .modal-header { height: 10px; border-radius: 12px 12px 0 0; margin: -20px -20px 20px -20px; background: #ccc; transition: background 0.3s; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
    .form-group textarea { height: 60px; resize: none; }
    .time-inputs { display: flex; align-items: center; gap: 10px; }
    .color-picker { display: flex; gap: 8px; margin-top: 5px; }
    .color-circle { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s; }
    .color-circle:hover { transform: scale(1.1); }
    .color-circle.selected { border-color: #1F2937; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
    .modal-actions { display: flex; justify-content: space-between; margin-top: 20px; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
    .btn-save { background: #4F46E5; color: white; }
    .btn-close { background: #E5E7EB; color: #1F2937; }
    .btn-delete { background: #FEE2E2; color: #EF4444; }
    #file-input { display: none; }
    #ai-image-input { display: none; }

    /* AI取込モーダル */
    #ai-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1100; justify-content: center; align-items: center; }
    .ai-modal-content { background: white; width: 520px; max-height: 80vh; display: flex; flex-direction: column; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .ai-modal-title { margin: 0 0 4px 0; font-size: 18px; color: #1F2937; display: flex; align-items: center; gap: 8px; }
    .ai-modal-sub { font-size: 12px; color: #6B7280; margin-bottom: 16px; }
    .ai-badge { background: #4F46E5; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; }
    .ai-drop-zone { border: 2px dashed #C7D2FE; border-radius: 10px; padding: 24px; text-align: center; color: #6366F1; cursor: pointer; transition: 0.15s; background: #F5F3FF; }
    .ai-drop-zone:hover { background: #EEF2FF; border-color: #6366F1; }
    .ai-drop-zone.has-file { background: #ECFDF5; border-color: #10B981; color: #059669; }
    .ai-api-key-wrap { margin-top: 14px; }
    .ai-api-key-wrap label { display: block; font-size: 12px; color: #6B7280; margin-bottom: 4px; }
    .ai-api-key-wrap input { width: 100%; padding: 8px; border: 1px solid #E5E7EB; border-radius: 6px; font-size: 13px; box-sizing: border-box; font-family: monospace; }
    .ai-api-hint { font-size: 11px; color: #9CA3AF; margin-top: 4px; }
    .ai-api-hint a { color: #6366F1; }
    .ai-loading { text-align: center; padding: 40px 20px; color: #4F46E5; }
    .ai-loading .spinner { display: inline-block; width: 36px; height: 36px; border: 4px solid #E0E7FF; border-top-color: #4F46E5; border-radius: 50%; animation: ai-spin 0.8s linear infinite; }
    @keyframes ai-spin { to { transform: rotate(360deg); } }
    .ai-summary { background: #EEF2FF; color: #4F46E5; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; font-weight: bold; }
    .ai-extracted-list { overflow-y: auto; flex: 1; border: 1px solid #E5E7EB; border-radius: 8px; padding: 8px; margin-bottom: 12px; max-height: 300px; }
    .ai-event-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: #1F2937; }
    .ai-event-row:hover { background: #F9FAFB; }
    .ai-event-row.exists { color: #9CA3AF; background: #F9FAFB; }
    .ai-event-row .ai-date { font-weight: bold; min-width: 78px; color: #4F46E5; }
    .ai-event-row.exists .ai-date { color: #9CA3AF; }
    .ai-event-row .ai-time { min-width: 90px; font-variant-numeric: tabular-nums; color: #6B7280; font-size: 12px; }
    .ai-event-row .ai-title { flex: 1; }
    .ai-event-row .ai-exists-tag { font-size: 10px; color: #9CA3AF; background: #E5E7EB; padding: 2px 6px; border-radius: 6px; }
    .ai-modal-actions { display: flex; justify-content: space-between; margin-top: 8px; }
    .ai-btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
    .ai-btn-primary { background: #4F46E5; color: white; }
    .ai-btn-primary:disabled { background: #C7D2FE; cursor: not-allowed; }
    .ai-btn-secondary { background: #E5E7EB; color: #1F2937; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>Welcome</h2>
      <div id="login-error" class="error-msg"></div>
      <input type="password" id="password-input" placeholder="Password">
      <button onclick="checkLogin()">Login</button>
      <div class="reset-link" onclick="resetAllData()">画面がおかしい場合はリセット</div>
    </div>
  </div>

  <input type="file" id="file-input" accept=".ics">
  <input type="file" id="ai-image-input" accept="image/*">

  <!-- AI画像取込モーダル -->
  <div id="ai-modal-overlay">
    <div class="ai-modal-content">
      <h3 class="ai-modal-title"><span class="ai-badge">AI</span>カレンダー画像から予定を自動取込</h3>
      <div class="ai-modal-sub">スクリーンショットを解析し、既存にない予定だけを追加します</div>

      <!-- Step 1: アップロード -->
      <div id="ai-step-upload">
        <div class="ai-drop-zone" id="ai-drop-zone" onclick="document.getElementById('ai-image-input').click()">
          <div id="ai-drop-zone-text">📷 画像をクリックで選択</div>
        </div>
        <div class="ai-api-key-wrap">
          <label>Gemini APIキー <span style="color:#9CA3AF;">(保存されます)</span></label>
          <input type="password" id="ai-api-key" placeholder="AIzaSy...">
          <div class="ai-api-hint">取得: <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a></div>
        </div>
        <div class="ai-modal-actions">
          <button class="ai-btn ai-btn-secondary" onclick="closeAIImportModal()">キャンセル</button>
          <button class="ai-btn ai-btn-primary" id="ai-analyze-btn" onclick="startAIAnalysis()">解析開始</button>
        </div>
      </div>

      <!-- Step 2: ローディング -->
      <div id="ai-loading" class="ai-loading" style="display:none;">
        <div class="spinner"></div>
        <div style="margin-top:12px;">画像を解析中...</div>
      </div>

      <!-- Step 3: プレビュー -->
      <div id="ai-step-preview" style="display:none; flex:1; display:flex; flex-direction:column; min-height:0;">
        <div class="ai-summary" id="ai-summary"></div>
        <div class="ai-extracted-list" id="ai-extracted-list"></div>
        <div class="ai-modal-actions">
          <button class="ai-btn ai-btn-secondary" onclick="closeAIImportModal()">キャンセル</button>
          <button class="ai-btn ai-btn-primary" onclick="confirmAddEvents()">選択した予定を追加</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-overlay">
    <div class="modal-content">
      <div id="modal-header-bar" class="modal-header"></div>
      <div class="form-group">
        <label id="label-title">タイトル</label>
        <input type="text" id="input-title">
      </div>
      <div class="form-group" id="group-time">
        <label>時間 (例: 13:00)</label>
        <div class="time-inputs">
          <input type="time" id="input-start">
          <span>▶</span>
          <input type="time" id="input-end">
        </div>
      </div>
      <div class="form-group" id="group-deadline" style="display:none;">
        <label>締切日 (↑↓キーで変更可)</label>
        <input type="date" id="input-deadline">
      </div>
      <div class="form-group" id="group-month-range" style="display:none;">
        <label>期間 (開始日〜終了日)</label>
        <div class="time-inputs">
          <input type="date" id="input-month-start">
          <span>〜</span>
          <input type="date" id="input-month-end">
        </div>
      </div>
      <div class="form-group">
        <label>カラー</label>
        <div class="color-picker" id="color-picker"></div>
      </div>
      <div class="form-group">
        <label>詳細メモ</label>
        <textarea id="input-memo"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-delete" onclick="deleteItem()">削除</button>
        <div>
          <button class="btn btn-close" onclick="closeModal()">閉じる</button>
          <button class="btn btn-save" onclick="saveItem()">保存</button>
        </div>
      </div>
    </div>
  </div>

<script>
// =========================================================
//  1. グローバル変数と定数の定義 (ここを最初に！)
// =========================================================

// デザイン定数
const CONTROL_H = 60;
const DATE_H = 50;
const SIDEBAR_W = 70;
const HOUR_H = 80;
const RESIZE_MARGIN = 10;

// カラー定数
const COL_BG = '#F4F5F7';
const COL_WHITE = '#FFFFFF';
const COL_TEXT_MAIN = '#1F2937';
const COL_TEXT_SUB = '#6B7280';
const COL_LINE = '#E5E7EB';
const COL_ACCENT = '#4F46E5';
const COL_TODAY_BG = '#EEF2FF';

const COL_DOING_BG = '#EEF2FF';
const COL_BACKLOG_BG = '#F3F4F6';
const COL_DONE_BG = '#E5E7EB';

const EVENT_COLORS = ['#3B82F6', '#EF4444', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#6366F1', '#6B7280'];
const TASK_COLORS = ['#EF4444', '#F59E0B', '#10B981', '#3B82F6'];

// 保存関連
const LOCAL_STATE_KEY = 'schedule_app_state_v2';
const LEGACY_EVENT_KEY = 'calendar_events';
const LEGACY_BACKLOG_KEY = 'task_backlog';
const LEGACY_DOING_KEY = 'task_doing';
const LEGACY_DONE_KEY = 'task_done';
const SUPABASE_URL = 'https://hmfofilydcplgbzktcpc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8l_QOufaBpxoiT0pQSzi9g_OyWO9G9D';
const SUPABASE_STATE_TABLE = 'app_state';
const SUPABASE_STATE_ID = 'shared';

// 状態変数 (ここで宣言しておけば ReferenceError になりません)
let showModal = false;
let showTaskModal = false;
let isLoggedIn = false;
let isEditingDeadline = false;

// データ配列
let events = [];
let monthPlans = [];
let backlogTasks = [];
let doingTasks = [];
let doneTasks = [];

// カレンダー表示状態
let viewStartDate;
let visibleDays = 4;
let scrollY = -600;
let taskScrollY = 0;
let currentMode = 0; // 0:Calendar, 1:Task
let calendarViewMode = 'time'; // 'time' or 'month'
let dataUpdatedAt = Date.now();

// 操作系変数
let selectedItem = null;
let selectedItemKind = 'event'; // 'event' | 'task' | 'month'
let creatingEvent = null;
let draggingItem = null;
let dragAction = 0; // 0:None, 1:Create, 2:Move, 3:ResizeTop, 4:ResizeBottom
let dragOffsetTime = 0;
let taskDragOffsetY = 0;
let isTaskDragging = false;
let supabaseSyncStatus = "Supabase未接続";
let supabaseSaveTimer = null;
let isSupabaseWriteInProgress = false;
let supabaseSaveQueued = false;
let supabaseClientCache = null;

// ボタン管理配列
const buttons = [];

// =========================================================
//  2. クラス定義
// =========================================================
class Button {
  constructor(l, x, y, w, h, action, alignRight=false, color='#E5E7EB') {
    this.label = l; this.x = x; this.y = y; this.w = w; this.h = h;
    this.action = action; this.alignRight = alignRight; this.color = color;
  }
}

class Event {
  constructor(dateStr, start, duration, title, colorIdx, type=0) {
    this.dateStr = dateStr; 
    this.start = start; 
    this.duration = duration; 
    this.title = title; 
    this.colorIdx = colorIdx;
    this.memo = "";
    this.type = type; // 0:Plan, 1:Actual
  }
}

class Task {
  constructor(title, deadline, memo, colorIdx) {
    this.title = title; 
    this.deadline = deadline; 
    this.memo = memo; 
    this.colorIdx = colorIdx;
    this.completedDate = "";
    this.status = 0; // 0:Doing, 1:Backlog, 2:Done
  }
}

class MonthPlan {
  constructor(startDateStr, endDateStr, title, colorIdx) {
    this.startDateStr = startDateStr;
    this.endDateStr = endDateStr || startDateStr;
    this.title = title;
    this.colorIdx = colorIdx;
    this.memo = "";
  }
}

// =========================================================
//  3. システム初期化 & p5.js関数
// =========================================================

function checkLogin() {
  const pass = document.getElementById('password-input').value;
  if (pass === 'jugerun') {
    document.getElementById('login-screen').style.display = 'none';
    isLoggedIn = true;
    loop(); // 描画開始
  } else {
    document.getElementById('login-error').innerText = "パスワードが違います";
  }
}

function resetAllData() {
  if(confirm("全てのデータを削除してリセットしますか？")) {
    clearLocalData();
    resetSupabaseDataIfConfigured().finally(() => location.reload());
  }
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  if (!isLoggedIn) noLoop();
  
  // フォント設定 (Web標準)
  textFont('sans-serif');
  textStyle(NORMAL);
  
  viewStartDate = new Date();
  viewStartDate.setHours(0,0,0,0);
  
  loadData();
  setupButtons();
  setupKeyEvents();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
  if (!isLoggedIn) return;
  
  background(COL_BG);
  updateCursor();
  drawControlBar();

  if (currentMode === 0) {
    // --- カレンダーモード ---
    if (calendarViewMode === 'month') {
      push();
      translate(0, CONTROL_H);
      drawMonthView();
      pop();
    } else {
      push();
      translate(0, CONTROL_H);
      drawDateHeader();
      translate(0, DATE_H);
      
      // スクロール
      push();
      translate(0, scrollY);
      
      drawTimeGrid();
      drawEvents();
      
      // ドラッグ中の新規イベント
      if (dragAction === 1 && creatingEvent) {
        let d = new Date(creatingEvent.dateStr);
        let offset = getDayOffset(d);
        if (offset >= 0 && offset < visibleDays) {
          let isSplit = isPastOrToday(d);
          drawEventRect(creatingEvent, offset, isSplit);
        }
      }
      
      pop(); 
      pop();
    }
    
    // マスク代わりの再描画
    drawControlBar();

  } else {
    // --- タスクモード ---
    push();
    translate(0, CONTROL_H);
    drawTaskList();
    pop();
    drawControlBar();
  }
}

// =========================================================
//  4. 描画ロジック
// =========================================================

function drawControlBar() {
  noStroke(); fill(COL_WHITE); rect(0, 0, width, CONTROL_H);
  fill(0, 20); rect(0, CONTROL_H, width, 1);
  fill(COL_TEXT_MAIN); textAlign(CENTER, CENTER); textSize(18); textStyle(BOLD);
  
  if (currentMode === 0) {
    let d = new Date(viewStartDate);
    text(`${d.getFullYear()}年 ${d.getMonth()+1}月`, width/2, CONTROL_H/2);
    drawButtons();
  } else {
    text("タスクボード (Doing / Backlog / Done)", width/2, CONTROL_H/2);
    drawButtons();
  }
  textSize(11);
  textAlign(RIGHT, CENTER);
  fill(COL_TEXT_SUB);
  text(supabaseSyncStatus, width - 12, CONTROL_H - 10);
  textStyle(NORMAL);
}

function setupButtons() {
  buttons.length = 0; // Reset
  addButton("<<", 20, 15, 40, 30, () => calendarViewMode === 'month' ? moveMonth(-12) : moveDate(-7));
  addButton("<", 70, 15, 40, 30, () => calendarViewMode === 'month' ? moveMonth(-1) : moveDate(-1));
  addButton("今日", 120, 15, 60, 30, () => { viewStartDate = new Date(); viewStartDate.setHours(0,0,0,0); });
  addButton(">", 190, 15, 40, 30, () => calendarViewMode === 'month' ? moveMonth(1) : moveDate(1));
  addButton(">>", 240, 15, 40, 30, () => calendarViewMode === 'month' ? moveMonth(12) : moveDate(7));
  addButton("Day", -280, 15, 50, 30, () => { calendarViewMode = 'time'; visibleDays = 1; }, true);
  addButton("4 Days", -220, 15, 60, 30, () => { calendarViewMode = 'time'; visibleDays = 4; }, true);
  addButton("Week", -150, 15, 50, 30, () => { calendarViewMode = 'time'; visibleDays = 7; }, true);
  addButton("Month", -90, 15, 60, 30, () => { calendarViewMode = 'month'; }, true);
  addButton("ICS出力", -310, 15, 80, 30, exportICS, true, '#10B981');
  addButton("ICS読込", -400, 15, 80, 30, () => document.getElementById('file-input').click(), true, '#3B82F6');
  addButton("AI画像読込", -510, 15, 100, 30, openAIImportModal, true, '#8B5CF6');
  addButton("モード切替", -640, 15, 120, 30, toggleMode, true, '#6366F1');
}
function addButton(l, x, y, w, h, act, ar=false, col='#E5E7EB') {
  buttons.push(new Button(l, x, y, w, h, act, ar, col));
}
function drawButtons() {
  textSize(12);
  buttons.forEach(b => {
    let bx = b.alignRight ? width + b.x : b.x;
    if (currentMode === 1) { if (['Day', '4 Days', 'Week', 'Month', '<<', '<', '>', '>>', '今日'].includes(b.label)) return; }
    let active = false;
    if (b.label === 'Day' && currentMode === 0 && calendarViewMode === 'time' && visibleDays === 1) active = true;
    if (b.label === '4 Days' && currentMode === 0 && calendarViewMode === 'time' && visibleDays === 4) active = true;
    if (b.label === 'Week' && currentMode === 0 && calendarViewMode === 'time' && visibleDays === 7) active = true;
    if (b.label === 'Month' && currentMode === 0 && calendarViewMode === 'month') active = true;
    const buttonColor = active ? COL_ACCENT : b.color;
    fill(buttonColor); noStroke(); rect(bx, b.y, b.w, b.h, 5);
    fill(b.color === '#E5E7EB' ? COL_TEXT_SUB : 'white');
    if (active) fill('white');
    let txt = b.label;
    if (b.label === "モード切替") txt = currentMode === 0 ? "タスク一覧へ" : "カレンダーへ";
    textAlign(CENTER, CENTER); text(txt, bx + b.w/2, b.y + b.h/2);
  });
}

function drawMonthView() {
  const meta = getMonthGridMeta();
  const weekHeaderH = meta.weekHeaderH;
  const cellW = meta.cellW;
  const cellH = meta.cellH;
  const monthStart = meta.monthStart;
  const gridStart = meta.gridStart;
  const barLayout = getMonthBarLayout();
  const weekSegments = getMonthWeekSegments(meta, barLayout.maxLanes);
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  noStroke();
  fill(COL_WHITE);
  rect(0, 0, width, weekHeaderH);
  for (let i = 0; i < 7; i++) {
    fill(COL_TEXT_SUB);
    textAlign(CENTER, CENTER);
    textSize(13);
    textStyle(BOLD);
    text(getDayName(i), i * cellW + cellW / 2, weekHeaderH / 2);
  }

  for (let idx = 0; idx < 42; idx++) {
    const col = idx % 7;
    const row = Math.floor(idx / 7);
    const x = col * cellW;
    const y = weekHeaderH + row * cellH;
    const dayDate = new Date(gridStart);
    dayDate.setDate(gridStart.getDate() + idx);
    const inCurrentMonth = dayDate.getMonth() === monthStart.getMonth();
    const isToday = isSameDate(dayDate, today);
    fill(inCurrentMonth ? COL_WHITE : '#F9FAFB');
    rect(x, y, cellW, cellH);
    stroke(COL_LINE);
    line(x, y, x + cellW, y);
    line(x, y, x, y + cellH);
    if (col === 6) line(x + cellW, y, x + cellW, y + cellH);
    if (row === 5) line(x, y + cellH, x + cellW, y + cellH);
    noStroke();

    if (isToday) {
      fill(COL_ACCENT);
      ellipse(x + 20, y + 16, 24, 24);
      fill(255);
    } else {
      fill(inCurrentMonth ? COL_TEXT_MAIN : '#9CA3AF');
    }
    textAlign(CENTER, CENTER);
    textSize(12);
    textStyle(BOLD);
    text(`${dayDate.getDate()}`, x + 20, y + 16);
  }

  for (let i = 0; i < weekSegments.length; i++) {
    const seg = weekSegments[i];
    fill(EVENT_COLORS[seg.plan.colorIdx]);
    const r1 = seg.continuesFromPrevWeek ? 1 : 4;
    const r2 = seg.continuesToNextWeek ? 1 : 4;
    rect(seg.x, seg.y, seg.w, barLayout.barH, r1, r2, r2, r1);

    fill(255);
    textAlign(LEFT, CENTER);
    textSize(10);
    textStyle(NORMAL);
    if (seg.w > 24) {
      text(seg.plan.title, seg.x + 4, seg.y + barLayout.barH / 2 + 0.5);
    }
  }
}

function drawDateHeader() {
  let colW = (width - SIDEBAR_W) / visibleDays;
  let d = new Date(viewStartDate);
  noStroke();
  for (let i = 0; i < visibleDays; i++) {
    let x = SIDEBAR_W + i * colW;
    let isToday = isSameDate(d, new Date());
    fill(COL_BG); rect(x, 0, colW, DATE_H);
    if (isToday) { fill(COL_ACCENT); ellipse(x + colW/2, DATE_H/2, 30, 30); fill(255); } else { fill(COL_TEXT_SUB); }
    textAlign(CENTER, CENTER); textSize(14); textStyle(BOLD);
    text(`${d.getDate()} (${getDayName(d.getDay())})`, x + colW/2, DATE_H/2);
    textStyle(NORMAL); stroke(COL_LINE); line(x, 0, x, DATE_H);
    d.setDate(d.getDate() + 1);
  }
  fill(COL_BG); rect(0, 0, SIDEBAR_W, DATE_H);
}

// ★ 予実管理対応 TimeGrid
function drawTimeGrid() {
  let colW = (width - SIDEBAR_W) / visibleDays;
  let d = new Date(viewStartDate);
  let today = new Date(); today.setHours(0,0,0,0);
  
  noStroke();
  for (let i = 0; i < visibleDays; i++) {
    let x = SIDEBAR_W + i * colW;
    let isSplit = d <= today; // 今日・過去は分割
    
    if (isSameDate(d, today)) { fill(COL_TODAY_BG); rect(x, 0, colW, 24 * HOUR_H); }
    
    // 分割線
    if (isSplit) {
      stroke(COL_LINE);
      line(x + colW/2, 0, x + colW/2, 24 * HOUR_H);
    }
    d.setDate(d.getDate() + 1);
  }
  
  textAlign(RIGHT, CENTER); textSize(11); fill(COL_TEXT_SUB);
  for (let i = 0; i <= 24; i++) {
    let y = i * HOUR_H; stroke(COL_LINE); line(SIDEBAR_W, y, width, y); noStroke(); text(`${i}:00`, SIDEBAR_W - 10, y);
    if (i < 24) { stroke(240); line(SIDEBAR_W, y + HOUR_H/2, width, y + HOUR_H/2); }
  }
  stroke(COL_LINE); for (let i = 0; i <= visibleDays; i++) line(SIDEBAR_W + i * colW, 0, SIDEBAR_W + i * colW, 24 * HOUR_H);
}

// ★ 予実管理対応 Event描画
function drawEvents() {
  let today = new Date(); today.setHours(0,0,0,0);
  for (let e of events) {
    let d = new Date(e.dateStr); d.setHours(0,0,0,0);
    let offset = getDayOffset(d);
    
    if (offset >= 0 && offset < visibleDays) {
      let isSplit = d <= today;
      drawEventRect(e, offset, isSplit);
    }
  }
}

function drawEventRect(e, offset, isSplit) {
  let colW = (width - SIDEBAR_W) / visibleDays;
  let x = SIDEBAR_W + offset * colW;
  let w = colW;
  
  // type 0:Plan, 1:Actual
  if (isSplit) {
    w = colW / 2;
    if (e.type === 1) x += w; // Actualは右側
  } else {
    if (e.type === 1) return; // 未来の実績は非表示
  }
  
  let y = e.start * HOUR_H;
  let h = e.duration * HOUR_H;
  let pad = 4;
  
  noStroke(); fill(0, 20); rect(x+pad+2, y+2, w-pad*2, h, 4);
  
  fill(EVENT_COLORS[e.colorIdx]);
  // 実績は少し見た目を変える（枠線）
  if (e.type === 1) { stroke(255, 150); strokeWeight(2); } else { noStroke(); }
  
  rect(x+pad, y, w-pad*2, h, 4); 
  noStroke(); strokeWeight(1);
  fill(0, 50); rect(x+pad, y, 5, h, 4, 0, 0, 4);
  
  if (e === selectedItem) { noFill(); stroke(0); strokeWeight(2); rect(x+pad, y, w-pad*2, h, 4); strokeWeight(1); noStroke(); }
  
  fill(255); textAlign(LEFT, TOP);
  // クリップ代わりの簡易表示
  if (h > 20) { textSize(11); textStyle(BOLD); text(e.title, x+pad+8, y+4); }
  if (h > 40) { textSize(10); textStyle(NORMAL); text(`${formatTime(e.start)}`, x+pad+8, y+20); }
}

function drawTaskList() {
  let fullH = height - CONTROL_H; let colW = width / 3;
  noStroke();
  fill(COL_DOING_BG);   rect(0, 0, colW, fullH);
  fill(COL_BACKLOG_BG); rect(colW, 0, colW, fullH);
  fill(COL_DONE_BG);    rect(colW*2, 0, colW, fullH);
  stroke(COL_LINE); strokeWeight(2); line(colW, 0, colW, fullH); line(colW*2, 0, colW*2, fullH); strokeWeight(1);
  fill(COL_TEXT_SUB); textAlign(CENTER, TOP); textSize(14); textStyle(BOLD);
  text(`現在取り組んでいること (${doingTasks.length})`, colW/2, 10);
  text(`今後増えること (${backlogTasks.length})`, colW*1.5, 10);
  text(`終わったもの (${doneTasks.length})`, colW*2.5, 10);
  push(); translate(0, taskScrollY);
  let itemH = 60; let margin = 40; let gap = 10; let cardW = colW - 30;
  drawTaskItems(doingTasks, 15, margin, cardW, itemH, gap);
  drawTaskItems(backlogTasks, colW + 15, margin, cardW, itemH, gap);
  drawTaskItems(doneTasks, colW*2 + 15, margin, cardW, itemH, gap, true);
  pop();
  if (isTaskDragging && draggingItem) {
    drawTaskCard(draggingItem, mouseX - cardW/2, mouseY - CONTROL_H + taskDragOffsetY, cardW, itemH);
  }
}
function drawTaskItems(list, x, startY, w, h, gap, showDeleteDate=false) {
  for (let i = 0; i < list.length; i++) {
    let t = list[i];
    if (t === draggingItem) continue;
    let y = startY + i * (h + gap);
    drawTaskCard(t, x, y, w, h);
    if (showDeleteDate && t.completedDate) {
      let delD = new Date(t.completedDate); delD.setDate(delD.getDate() + 7);
      fill(COL_TEXT_SUB); textSize(10); textAlign(RIGHT, BOTTOM);
      text(`削除: ${delD.getMonth()+1}/${delD.getDate()}`, x + w, y + h + 10);
    }
  }
}
function drawTaskCard(t, x, y, w, h) {
  noStroke(); fill(0, 10); rect(x+3, y+3, w, h, 8); fill(255); rect(x, y, w, h, 8);
  fill(TASK_COLORS[t.colorIdx]); rect(x, y, 8, h, 8, 0, 0, 8);
  if (t === selectedItem) { noFill(); stroke(COL_ACCENT); strokeWeight(2); rect(x, y, w, h, 8); strokeWeight(1); noStroke(); }
  fill(COL_TEXT_MAIN); textAlign(LEFT, CENTER); textSize(14); textStyle(BOLD); text(t.title, x+20, y+h/2-8);
  fill(COL_TEXT_SUB); textSize(11); textStyle(NORMAL); text(`締切: ${t.deadline}`, x+20, y+h/2+10);
}

//  5. インタラクション (入力・クリック)

function setupKeyEvents() {
  document.getElementById('password-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') checkLogin(); });
  const inputs = ['input-title', 'input-start', 'input-end', 'input-deadline', 'input-month-start', 'input-month-end'];
  inputs.forEach(id => { document.getElementById(id).addEventListener('keydown', function(e) { if (e.key === 'Enter') saveItem(); }); });
  document.getElementById('input-deadline').addEventListener('keydown', function(e) { if (e.key === 'ArrowUp') { changeDate(1); e.preventDefault(); } else if (e.key === 'ArrowDown') { changeDate(-1); e.preventDefault(); } });
}
function changeDate(delta) { let input = document.getElementById('input-deadline'); if (input.value) { let d = new Date(input.value); d.setDate(d.getDate() + delta); input.value = formatDateISO(d); } }

function doubleClicked() {
  if (document.getElementById('modal-overlay').style.display === 'flex') return;
  if (mouseY < CONTROL_H) return;
  if (currentMode === 0) {
    if (calendarViewMode === 'month') {
      handleMonthViewClick();
      return false;
    }
    let colW = (width - SIDEBAR_W) / visibleDays;
    let today = new Date(); today.setHours(0,0,0,0);
    for (let i = events.length - 1; i >= 0; i--) {
      let e = events[i];
      let d = new Date(e.dateStr); d.setHours(0,0,0,0);
      let offset = getDayOffset(d);
      if (offset < 0 || offset >= visibleDays) continue;
      let isSplit = d <= today;
      let w = isSplit ? colW / 2 : colW;
      let x = SIDEBAR_W + offset * colW;
      if (isSplit && e.type === 1) x += w;
      if (!isSplit && e.type === 1) continue;
      let y = CONTROL_H + DATE_H + scrollY + e.start * HOUR_H;
      let h = e.duration * HOUR_H;
      if (mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h) { openModal(e, 'event'); return false; }
    }
  } else {
    let colW = width / 3; let itemH = 60; let margin = 40; let gap = 10;
    let zone = Math.floor(mouseX / colW);
    let targetList = (zone===0) ? doingTasks : (zone===1) ? backlogTasks : doneTasks;
    let localY = mouseY - CONTROL_H - taskScrollY - margin;
    let index = Math.floor(localY / (itemH + gap));
    if (index >= 0 && index < targetList.length) { openModal(targetList[index], 'task'); return false; }
  }
}

function mousePressed() {
  if (document.getElementById('modal-overlay').style.display === 'flex') return;
  if (!isLoggedIn) return;
  let btnClicked = false;
  buttons.forEach(b => {
    let bx = b.alignRight ? width + b.x : b.x;
    if (currentMode === 1) { if (['Day','4 Days','Week','Month','<<','<','>','>>','今日'].includes(b.label)) return; }
    if (mouseX >= bx && mouseX <= bx + b.w && mouseY >= b.y && mouseY <= b.y + b.h) { b.action(); btnClicked = true; }
  });
  if (btnClicked) return;
  if (mouseY < CONTROL_H) return;

  if (currentMode === 0) {
    if (calendarViewMode === 'month') {
      handleMonthViewClick();
      return;
    }
    if (mouseX < SIDEBAR_W) return;
    let globalY = mouseY - CONTROL_H - DATE_H - scrollY;
    let timeVal = snapTo15Min(globalY / HOUR_H);
    let colW = (width - SIDEBAR_W) / visibleDays;
    let dayIndex = Math.floor((mouseX - SIDEBAR_W) / colW);
    let d = new Date(viewStartDate); d.setDate(d.getDate() + dayIndex); d.setHours(0,0,0,0);
    let today = new Date(); today.setHours(0,0,0,0);
    let isSplit = d <= today;
    let clickedType = 0; 
    if (isSplit) { let relX = (mouseX - SIDEBAR_W) % colW; if (relX > colW/2) clickedType = 1; }
    let clicked = null;
    for (let i = events.length - 1; i >= 0; i--) {
      let e = events[i];
      let ed = new Date(e.dateStr); ed.setHours(0,0,0,0);
      let offset = getDayOffset(ed);
      if (offset < 0 || offset >= visibleDays) continue;
      if (isSplit && e.type !== clickedType) continue;
      if (!isSplit && e.type === 1) continue;
      let w = isSplit ? colW/2 : colW;
      let x = SIDEBAR_W + offset * colW + (e.type===1 && isSplit ? w : 0);
      let y = CONTROL_H + DATE_H + scrollY + e.start * HOUR_H;
      let h = e.duration * HOUR_H;
      if (mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h) {
        clicked = e;
        let relY = mouseY - y;
        if (relY < RESIZE_MARGIN) dragAction = 3; else if (relY > h - RESIZE_MARGIN) dragAction = 4;
        else { dragAction = 2; dragOffsetTime = timeVal - e.start; }
        break;
      }
    }
    if (clicked) { selectedItem = clicked; } 
    else {
      if (dayIndex >= 0 && dayIndex < visibleDays && timeVal >= 0 && timeVal < 24) {
        let newType = clickedType; if (!isSplit) newType = 0;
        creatingEvent = new Event(formatDateISO(d), timeVal, 1.0, "新規" + (newType===0?"予定":"実績"), 0, newType);
        selectedItem = creatingEvent; dragAction = 1;
      }
    }
  } else {
    let colW = width / 3; let itemH = 60; let margin = 40; let gap = 10;
    let localY = mouseY - CONTROL_H - taskScrollY - margin;
    let index = Math.floor(localY / (itemH + gap));
    let zone = Math.floor(mouseX / colW);
    let targetList = (zone===0) ? doingTasks : (zone===1) ? backlogTasks : doneTasks;
    if (index >= 0 && index < targetList.length) {
      selectedItem = targetList[index];
      draggingItem = selectedItem; isTaskDragging = true;
      let itemTop = margin + index * (itemH + gap) + taskScrollY;
      taskDragOffsetY = itemTop - (mouseY - CONTROL_H);
    } else {
      if (zone !== 2) {
        let newTask = new Task("新しいタスク", formatDateISO(new Date()), "", 2);
        targetList.push(newTask); selectedItem = newTask; openModal(newTask, 'task'); saveData();
      }
    }
  }
}

function mouseDragged() {
  if (document.getElementById('modal-overlay').style.display === 'flex') return;
  if (currentMode === 0) {
    if (calendarViewMode === 'month') return;
    if (dragAction === 0) return;
    let globalY = mouseY - CONTROL_H - DATE_H - scrollY;
    let rawTime = globalY / HOUR_H; let snapTime = snapTo15Min(rawTime);
    let colW = (width - SIDEBAR_W) / visibleDays;
    let dayIndex = Math.floor((mouseX - SIDEBAR_W) / colW);
    if (dayIndex < 0) dayIndex = 0; if (dayIndex >= visibleDays) dayIndex = visibleDays - 1;
    let d = new Date(viewStartDate); d.setDate(d.getDate() + dayIndex);
    if (dragAction === 1 && creatingEvent) {
      let dur = snapTime - creatingEvent.start; if (dur < 0.25) dur = 0.25; creatingEvent.duration = dur;
    } else if (selectedItem) {
      if (dragAction === 2) {
        let newStart = snapTo15Min(rawTime - dragOffsetTime); if (newStart < 0) newStart = 0;
        if (newStart + selectedItem.duration > 24) newStart = 24 - selectedItem.duration;
        selectedItem.start = newStart; selectedItem.dateStr = formatDateISO(d);
      } else if (dragAction === 3) {
        let oldEnd = selectedItem.start + selectedItem.duration; let newStart = snapTime;
        if (newStart > oldEnd - 0.25) newStart = oldEnd - 0.25; selectedItem.start = newStart; selectedItem.duration = oldEnd - newStart;
      } else if (dragAction === 4) {
        let newEnd = snapTime; let newDur = newEnd - selectedItem.start;
        if (newDur < 0.25) newDur = 0.25; selectedItem.duration = newDur;
      }
    }
  }
}

function mouseReleased() {
  if (currentMode === 0) {
    if (calendarViewMode === 'month') return;
    if (dragAction === 1 && creatingEvent) {
      addEventWithAutoActual(creatingEvent); selectedItem = creatingEvent;
      openModal(selectedItem, 'event'); creatingEvent = null;
    }
    dragAction = 0; saveData();
  } else {
    if (isTaskDragging && draggingItem) {
      let colW = width / 3; let dropZone = Math.floor(mouseX / colW);
      removeFromAllLists(draggingItem);
      if (dropZone === 0) { doingTasks.push(draggingItem); draggingItem.completedDate = ""; }
      else if (dropZone === 1) { backlogTasks.push(draggingItem); draggingItem.completedDate = ""; }
      else { doneTasks.unshift(draggingItem); if (!draggingItem.completedDate) draggingItem.completedDate = formatDateISO(new Date()); }
      openModal(draggingItem, 'task'); isTaskDragging = false; draggingItem = null; saveData();
    }
  }
}

function mouseWheel(event) {
  if (document.getElementById('modal-overlay').style.display === 'flex') return;
  let d = event.deltaY;
  if (currentMode === 0) {
    if (calendarViewMode === 'month') return false;
    scrollY -= d;
    let maxH = 24 * HOUR_H; let viewH = height - CONTROL_H - DATE_H;
    if (scrollY > 0) scrollY = 0; if (scrollY < viewH - maxH) scrollY = viewH - maxH;
  } else {
    taskScrollY -= d;
    if (taskScrollY > 0) taskScrollY = 0;
    let maxCount = Math.max(doingTasks.length, backlogTasks.length, doneTasks.length);
    let contentH = maxCount * 70 + 100;
    let viewH = height - CONTROL_H;
    if (taskScrollY < viewH - contentH) taskScrollY = viewH - contentH;
    if (contentH < viewH) taskScrollY = 0;
  }
}

// --- Utils ---
function openModal(item, type) {
  selectedItem = item;
  selectedItemKind = type;
  let modal = document.getElementById('modal-overlay');
  let headerBar = document.getElementById('modal-header-bar');
  let colorPicker = document.getElementById('color-picker');
  modal.style.display = 'flex';
  document.getElementById('input-title').value = item.title;
  document.getElementById('input-memo').value = item.memo;
  colorPicker.innerHTML = '';
  let colors = EVENT_COLORS;
  if (type === 'task') colors = TASK_COLORS;
  colors.forEach((c, idx) => {
    let div = document.createElement('div');
    div.className = 'color-circle' + (idx === item.colorIdx ? ' selected' : '');
    div.style.backgroundColor = c;
    div.onclick = () => {
      item.colorIdx = idx;
      headerBar.style.background = c;
      Array.from(colorPicker.children).forEach((child, i) => {
        if(i === idx) child.classList.add('selected'); else child.classList.remove('selected');
      });
    };
    colorPicker.appendChild(div);
  });
  headerBar.style.background = colors[item.colorIdx];
  if (type === 'event') {
    let label = document.getElementById('label-title');
    label.innerText = (item.type===1) ? "実績タイトル" : "予定タイトル";
    document.getElementById('group-time').style.display = 'block';
    document.getElementById('group-deadline').style.display = 'none';
    document.getElementById('group-month-range').style.display = 'none';
    document.getElementById('input-start').value = formatTimeInput(item.start);
    document.getElementById('input-end').value = formatTimeInput(item.start + item.duration);
  } else if (type === 'task') {
    document.getElementById('label-title').innerText = "タスク名";
    document.getElementById('group-time').style.display = 'none';
    document.getElementById('group-deadline').style.display = 'block';
    document.getElementById('group-month-range').style.display = 'none';
    document.getElementById('input-deadline').value = item.deadline;
  } else {
    document.getElementById('label-title').innerText = "月間予定";
    document.getElementById('group-time').style.display = 'none';
    document.getElementById('group-deadline').style.display = 'none';
    document.getElementById('group-month-range').style.display = 'block';
    document.getElementById('input-month-start').value = item.startDateStr;
    document.getElementById('input-month-end').value = item.endDateStr || item.startDateStr;
  }
}
function saveItem() {
  if (!selectedItem) return;
  selectedItem.title = document.getElementById('input-title').value;
  selectedItem.memo = document.getElementById('input-memo').value;
  if (selectedItemKind === 'event') {
    let s = parseTimeInput(document.getElementById('input-start').value);
    let e = parseTimeInput(document.getElementById('input-end').value);
    if (s >= 0 && e > s) { selectedItem.start = s; selectedItem.duration = e - s; }
  } else if (selectedItemKind === 'task') {
    selectedItem.deadline = document.getElementById('input-deadline').value;
  } else if (selectedItemKind === 'month') {
    const s = document.getElementById('input-month-start').value || selectedItem.startDateStr;
    const e = document.getElementById('input-month-end').value || s;
    if (s <= e) {
      selectedItem.startDateStr = s;
      selectedItem.endDateStr = e;
    } else {
      selectedItem.startDateStr = e;
      selectedItem.endDateStr = s;
    }
  }
  saveData(); closeModal();
}
function deleteItem() {
  if (!selectedItem) return;
  if (selectedItemKind === 'event') {
    events = events.filter(e => e !== selectedItem);
  } else if (selectedItemKind === 'month') {
    monthPlans = monthPlans.filter(e => e !== selectedItem);
  } else {
    removeFromAllLists(selectedItem);
  }
  selectedItem = null; saveData(); closeModal();
}
function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
function toggleMode() { currentMode = (currentMode === 0) ? 1 : 0; }
function loadData() {
  let loadedUnified = false;
  const unified = localStorage.getItem(LOCAL_STATE_KEY);
  if (unified) {
    try {
      applySnapshot(JSON.parse(unified));
      loadedUnified = true;
    } catch (_) {}
  }

  if (!loadedUnified) {
    let svE = localStorage.getItem(LEGACY_EVENT_KEY); 
    if(svE) {
      let raw = JSON.parse(svE);
      events = raw.map(e => {
        let nev = new Event(e.dateStr, e.start||0, e.duration||1, e.title||"", e.colorIdx||0, e.type !== undefined ? e.type : 0);
        nev.memo = e.memo || ""; return nev;
      });
      // 自動同期
      let today = new Date(); today.setHours(0,0,0,0);
      let actualKeys = new Set();
      events.filter(e => e.type === 1).forEach(e => actualKeys.add(e.dateStr + "_" + e.title));
      let newActuals = [];
      events.forEach(e => {
        if(e.type === 0) {
          let d = new Date(e.dateStr); d.setHours(0,0,0,0);
          if(d <= today) {
            let key = e.dateStr + "_" + e.title;
            if(!actualKeys.has(key)) {
              let cp = new Event(e.dateStr, e.start, e.duration, e.title, e.colorIdx, 1);
              cp.memo = e.memo; newActuals.push(cp);
            }
          }
        }
      });
      events = events.concat(newActuals);
    }
    let svB = localStorage.getItem(LEGACY_BACKLOG_KEY); if(svB) backlogTasks = JSON.parse(svB).map(t => Object.assign(new Task(), t));
    let svD = localStorage.getItem(LEGACY_DOING_KEY); if(svD) doingTasks = JSON.parse(svD).map(t => Object.assign(new Task(), t));
    let svF = localStorage.getItem(LEGACY_DONE_KEY); if(svF) doneTasks = JSON.parse(svF).map(t => Object.assign(new Task(), t));
    saveLocalDataOnly();
  }

  let oneWeekAgo = new Date(); oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
  doneTasks = doneTasks.filter(t => { if (!t.completedDate) return true; return new Date(t.completedDate) >= oneWeekAgo; });
  initSupabaseSync();
}
function saveData() {
  dataUpdatedAt = Date.now();
  saveLocalDataOnly();
  queueSupabaseSave();
}
function moveDate(days) { viewStartDate.setDate(viewStartDate.getDate() + days); }
function moveMonth(months) { viewStartDate.setMonth(viewStartDate.getMonth() + months); }
function getDayOffset(date) { let diff = date - viewStartDate; return Math.floor(diff / (1000 * 60 * 60 * 24)); }
function isSameDate(d1, d2) { return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }
function isPastOrToday(d) { let today = new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0); return d <= today; }
function formatDateISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatTime(val) { let h = Math.floor(val); let m = Math.round((val - h) * 60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function formatTimeInput(val) { return formatTime(val); }
function parseTimeInput(str) { let parts = str.split(':'); if (parts.length === 2) return parseInt(parts[0]) + parseInt(parts[1])/60; return 0; }

function addEventWithAutoActual(eventItem) {
  events.push(eventItem);
  let d = new Date(eventItem.dateStr);
  d.setHours(0, 0, 0, 0);
  let today = new Date();
  today.setHours(0, 0, 0, 0);
  if (eventItem.type === 0 && d <= today) {
    const hasActual = events.some(e => e !== eventItem && e.type === 1 && e.dateStr === eventItem.dateStr && e.title === eventItem.title && Math.abs(e.start - eventItem.start) < 0.001);
    if (!hasActual) {
      let copy = new Event(eventItem.dateStr, eventItem.start, eventItem.duration, eventItem.title, eventItem.colorIdx, 1);
      copy.memo = eventItem.memo;
      events.push(copy);
    }
  }
}

function getMonthPlansByDate(dateStr) {
  return monthPlans
    .filter(e => dateStr >= e.startDateStr && dateStr <= (e.endDateStr || e.startDateStr))
    .sort((a, b) => {
      return a.title.localeCompare(b.title, 'ja');
    });
}

function getMonthGridMeta() {
  const weekHeaderH = 34;
  const cellW = width / 7;
  const cellH = (height - CONTROL_H - weekHeaderH) / 6;
  const monthStart = new Date(viewStartDate.getFullYear(), viewStartDate.getMonth(), 1);
  const gridStart = new Date(monthStart);
  gridStart.setDate(monthStart.getDate() - monthStart.getDay());
  return { weekHeaderH, cellW, cellH, monthStart, gridStart };
}

function getMonthBarLayout() {
  const barTopPad = 28;
  const barH = 14;
  const laneGap = 3;
  const laneStep = barH + laneGap;
  const cellH = (height - CONTROL_H - 34) / 6;
  const maxLanes = Math.max(1, Math.floor((cellH - barTopPad - 6) / laneStep));
  return { barTopPad, barH, laneGap, laneStep, maxLanes };
}

function parseISODateString(dateStr) {
  const p = dateStr.split('-');
  if (p.length !== 3) return new Date();
  return new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2]));
}

function clampDateStr(dateStr, minStr, maxStr) {
  if (dateStr < minStr) return minStr;
  if (dateStr > maxStr) return maxStr;
  return dateStr;
}

function getMonthWeekSegments(meta, maxLanes) {
  const segments = [];
  for (let row = 0; row < 6; row++) {
    const weekStartDate = new Date(meta.gridStart);
    weekStartDate.setDate(meta.gridStart.getDate() + row * 7);
    const weekEndDate = new Date(weekStartDate);
    weekEndDate.setDate(weekStartDate.getDate() + 6);
    const weekStartStr = formatDateISO(weekStartDate);
    const weekEndStr = formatDateISO(weekEndDate);
    const weekPlans = monthPlans
      .filter(p => (p.startDateStr || '') <= weekEndStr && (p.endDateStr || p.startDateStr || '') >= weekStartStr)
      .sort((a, b) => {
        if (a.startDateStr !== b.startDateStr) return a.startDateStr.localeCompare(b.startDateStr);
        if (a.endDateStr !== b.endDateStr) return a.endDateStr.localeCompare(b.endDateStr);
        return a.title.localeCompare(b.title, 'ja');
      });
    const laneLastEndCol = [];
    for (let i = 0; i < weekPlans.length; i++) {
      const plan = weekPlans[i];
      const planStartStr = plan.startDateStr;
      const planEndStr = plan.endDateStr || plan.startDateStr;
      const segStartStr = clampDateStr(planStartStr, weekStartStr, weekEndStr);
      const segEndStr = clampDateStr(planEndStr, weekStartStr, weekEndStr);
      const segStartDate = parseISODateString(segStartStr);
      const segEndDate = parseISODateString(segEndStr);
      const startCol = Math.max(0, Math.min(6, Math.floor((segStartDate - weekStartDate) / (1000 * 60 * 60 * 24))));
      const endCol = Math.max(0, Math.min(6, Math.floor((segEndDate - weekStartDate) / (1000 * 60 * 60 * 24))));
      let lane = 0;
      while (lane < laneLastEndCol.length && startCol <= laneLastEndCol[lane]) lane++;
      laneLastEndCol[lane] = endCol;
      if (lane >= maxLanes) continue;
      const x = startCol * meta.cellW + 3;
      const y = meta.weekHeaderH + row * meta.cellH + 28 + lane * 17;
      const w = (endCol - startCol + 1) * meta.cellW - 6;
      segments.push({
        row,
        lane,
        startCol,
        endCol,
        x,
        y,
        w,
        plan,
        continuesFromPrevWeek: planStartStr < weekStartStr,
        continuesToNextWeek: planEndStr > weekEndStr
      });
    }
  }
  return segments;
}

function getMonthEventHit(mouseXPos, mouseYPos) {
  const meta = getMonthGridMeta();
  const barLayout = getMonthBarLayout();
  const weekSegments = getMonthWeekSegments(meta, barLayout.maxLanes);
  const localY = mouseYPos - CONTROL_H;
  if (localY < meta.weekHeaderH) return null;
  const col = Math.floor(mouseXPos / meta.cellW);
  const row = Math.floor((localY - meta.weekHeaderH) / meta.cellH);
  if (col < 0 || col > 6 || row < 0 || row > 5) return null;
  const idx = row * 7 + col;
  const dayDate = new Date(meta.gridStart);
  dayDate.setDate(meta.gridStart.getDate() + idx);
  const dateStr = formatDateISO(dayDate);
  for (let i = 0; i < weekSegments.length; i++) {
    const seg = weekSegments[i];
    if (seg.row !== row) continue;
    if (mouseXPos >= seg.x && mouseXPos <= seg.x + seg.w && localY >= seg.y && localY <= seg.y + barLayout.barH) {
      return { dateStr, event: seg.plan, inCurrentMonth: dayDate.getMonth() === meta.monthStart.getMonth() };
    }
  }
  return { dateStr, event: null, inCurrentMonth: dayDate.getMonth() === meta.monthStart.getMonth() };
}

function handleMonthViewClick() {
  const hit = getMonthEventHit(mouseX, mouseY);
  if (!hit) return;
  if (hit.event) {
    selectedItem = hit.event;
    openModal(hit.event, 'month');
    return;
  }
  // 月外セルはナビゲーション扱いにする
  if (!hit.inCurrentMonth) {
    viewStartDate = new Date(hit.dateStr);
    viewStartDate.setDate(1);
    return;
  }
  let newPlan = new MonthPlan(hit.dateStr, hit.dateStr, '月間予定', 0);
  monthPlans.push(newPlan);
  selectedItem = newPlan;
  saveData();
  openModal(newPlan, 'month');
}

function createSnapshot() {
  return {
    version: 2,
    updatedAt: dataUpdatedAt,
    events,
    monthPlans,
    backlogTasks,
    doingTasks,
    doneTasks
  };
}

function applySnapshot(snapshot) {
  if (!snapshot) return;
  events = (snapshot.events || []).map(e => {
    let nev = new Event(e.dateStr, e.start||0, e.duration||1, e.title||"", e.colorIdx||0, e.type !== undefined ? e.type : 0);
    nev.memo = e.memo || "";
    return nev;
  });
  monthPlans = (snapshot.monthPlans || []).map(p => {
    const startStr = p.startDateStr || p.dateStr || formatDateISO(new Date());
    const endStr = p.endDateStr || startStr;
    let mp = new MonthPlan(startStr, endStr, p.title || "", p.colorIdx || 0);
    mp.memo = p.memo || "";
    return mp;
  });
  backlogTasks = (snapshot.backlogTasks || []).map(t => Object.assign(new Task(), t));
  doingTasks = (snapshot.doingTasks || []).map(t => Object.assign(new Task(), t));
  doneTasks = (snapshot.doneTasks || []).map(t => Object.assign(new Task(), t));
  dataUpdatedAt = snapshot.updatedAt || Date.now();
}

function saveLocalDataOnly() {
  const snapshot = createSnapshot();
  localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(snapshot));
  // 互換性のため旧キーにも保存
  localStorage.setItem(LEGACY_EVENT_KEY, JSON.stringify(events));
  localStorage.setItem(LEGACY_BACKLOG_KEY, JSON.stringify(backlogTasks));
  localStorage.setItem(LEGACY_DOING_KEY, JSON.stringify(doingTasks));
  localStorage.setItem(LEGACY_DONE_KEY, JSON.stringify(doneTasks));
}

function clearLocalData() {
  localStorage.removeItem(LOCAL_STATE_KEY);
  localStorage.removeItem(LEGACY_EVENT_KEY);
  localStorage.removeItem(LEGACY_BACKLOG_KEY);
  localStorage.removeItem(LEGACY_DOING_KEY);
  localStorage.removeItem(LEGACY_DONE_KEY);
}

function hasAnyData(snapshot) {
  if (!snapshot) return false;
  const ec = (snapshot.events || []).length;
  const mc = (snapshot.monthPlans || []).length;
  const bc = (snapshot.backlogTasks || []).length;
  const dc = (snapshot.doingTasks || []).length;
  const fc = (snapshot.doneTasks || []).length;
  return ec + mc + bc + dc + fc > 0;
}

function isSupabaseConfigured() {
  const hasUrl = SUPABASE_URL && !SUPABASE_URL.includes('YOUR_PROJECT_REF');
  const hasKey = SUPABASE_PUBLISHABLE_KEY && !SUPABASE_PUBLISHABLE_KEY.includes('YOUR_SUPABASE_PUBLISHABLE_KEY');
  return hasUrl && hasKey && typeof supabase !== 'undefined';
}

function getSupabaseClient() {
  if (!isSupabaseConfigured()) return null;
  if (!supabaseClientCache) {
    supabaseClientCache = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  }
  return supabaseClientCache;
}

async function fetchSupabaseSnapshot() {
  const client = getSupabaseClient();
  if (!client) return { ok: false, reason: 'not_configured' };
  const { data, error } = await client
    .from(SUPABASE_STATE_TABLE)
    .select('payload, updated_at')
    .eq('id', SUPABASE_STATE_ID)
    .maybeSingle();
  if (error) return { ok: false, reason: 'error', error };
  if (!data?.payload) return { ok: false, reason: 'not_found' };
  return { ok: true, snapshot: data.payload };
}

async function updateSupabaseSnapshot(snapshot) {
  const client = getSupabaseClient();
  if (!client) return { ok: false, reason: 'not_configured' };
  const { error } = await client
    .from(SUPABASE_STATE_TABLE)
    .update({
      payload: snapshot,
      updated_at: new Date().toISOString()
    })
    .eq('id', SUPABASE_STATE_ID);
  if (error) return { ok: false, reason: 'error', error };
  return { ok: true };
}

async function initSupabaseSync() {
  if (!isSupabaseConfigured()) {
    supabaseSyncStatus = "Supabase未設定";
    return;
  }
  supabaseSyncStatus = "Supabase接続中";
  try {
    const remote = await fetchSupabaseSnapshot();
    if (!remote.ok) {
      if (remote.reason === 'not_found') {
        supabaseSyncStatus = "Supabase行未作成";
      } else {
        supabaseSyncStatus = "Supabase読込失敗";
      }
      return;
    }

    const localSnapshot = createSnapshot();
    const remoteAt = remote.snapshot.updatedAt || 0;
    const localAt = localSnapshot.updatedAt || 0;
    if (remoteAt > localAt && hasAnyData(remote.snapshot)) {
      applySnapshot(remote.snapshot);
      saveLocalDataOnly();
      supabaseSyncStatus = "Supabaseから復元";
    } else if (localAt > remoteAt && hasAnyData(localSnapshot)) {
      const result = await updateSupabaseSnapshot(localSnapshot);
      supabaseSyncStatus = result.ok ? "Supabaseへ同期済み" : "Supabase初期同期失敗";
    } else {
      supabaseSyncStatus = "Supabase同期済み";
    }
  } catch (_) {
    supabaseSyncStatus = "Supabase同期エラー";
  }
}

function queueSupabaseSave() {
  if (!isSupabaseConfigured()) return;
  if (supabaseSaveTimer) clearTimeout(supabaseSaveTimer);
  supabaseSaveTimer = setTimeout(() => {
    persistSupabaseSave();
  }, 400);
}

async function persistSupabaseSave() {
  if (!isSupabaseConfigured()) return;
  if (isSupabaseWriteInProgress) {
    supabaseSaveQueued = true;
    return;
  }
  isSupabaseWriteInProgress = true;
  try {
    const result = await updateSupabaseSnapshot(createSnapshot());
    supabaseSyncStatus = result.ok ? "Supabase自動保存済み" : "Supabase保存失敗";
  } finally {
    isSupabaseWriteInProgress = false;
    if (supabaseSaveQueued) {
      supabaseSaveQueued = false;
      persistSupabaseSave();
    }
  }
}

async function resetSupabaseDataIfConfigured() {
  if (!isSupabaseConfigured()) return;
  const emptySnapshot = {
    version: 2,
    updatedAt: Date.now(),
    events: [],
    monthPlans: [],
    backlogTasks: [],
    doingTasks: [],
    doneTasks: []
  };
  await updateSupabaseSnapshot(emptySnapshot);
}

function exportICS() {
  let calContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//My Web App//EN\n";
  events.forEach(e => {
    if (e.type === 1) return;
    let d = new Date(e.dateStr);
    let sH = Math.floor(e.start); let sM = Math.round((e.start - sH) * 60);
    let eH = Math.floor(e.start + e.duration); let eM = Math.round((e.start + e.duration - eH) * 60);
    let dtStart = formatICSDate(d, sH, sM); let dtEnd = formatICSDate(d, eH, eM);
    calContent += "BEGIN:VEVENT\n" + `DTSTART:${dtStart}\n` + `DTEND:${dtEnd}\n` + `SUMMARY:${e.title}\n` + `DESCRIPTION:${e.memo.replace(/\n/g, '\\n')}\n` + "END:VEVENT\n";
  });
  calContent += "END:VCALENDAR";
  let blob = new Blob([calContent], { type: 'text/calendar' });
  let url = URL.createObjectURL(blob); let a = document.createElement('a'); a.href = url; a.download = 'schedule.ics'; a.click();
}
document.getElementById('file-input').addEventListener('change', function(e) {
  let file = e.target.files[0]; if (!file) return;
  let reader = new FileReader();
  reader.onload = function(e) { parseICS(e.target.result); }; reader.readAsText(file);
});
function parseICS(text) {
  let lines = text.split(/\r\n|\n|\r/); let inEvent = false; let tempEvent = {};
  lines.forEach(line => {
    if (line.startsWith('BEGIN:VEVENT')) { inEvent = true; tempEvent = {title:"No Title", memo:"", duration:1, type:0}; }
    else if (line.startsWith('END:VEVENT')) { if (inEvent && tempEvent.start) events.push(new Event(tempEvent.dateStr, tempEvent.start, tempEvent.duration, tempEvent.title, 0, 0)); inEvent = false; }
    else if (inEvent) {
      if (line.startsWith('SUMMARY:')) tempEvent.title = line.substring(8);
      else if (line.startsWith('DESCRIPTION:')) tempEvent.memo = line.substring(12).replace(/\\n/g, '\n');
      else if (line.startsWith('DTSTART')) {
        let val = line.split(':')[1]; let p = parseICSDate(val);
        tempEvent.dateStr = formatDateISO(p.d); tempEvent.start = p.h + p.m/60;
      }
    }
  });
  saveData(); alert('インポート完了');
}
function formatICSDate(d, h, m) { return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}00`; }
function parseICSDate(str) {
  let y = parseInt(str.substring(0,4)); let m = parseInt(str.substring(4,6))-1; let d = parseInt(str.substring(6,8));
  let h = 0, min = 0;
  if (str.includes('T')) { let tPart = str.split('T')[1]; h = parseInt(tPart.substring(0,2)); min = parseInt(tPart.substring(2,4)); }
  return { d: new Date(y,m,d), h: h, m: min };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve(result.split(',')[1]);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callGeminiVision(apiKey, base64Data, mimeType) {
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth() + 1;

  const prompt = `この画像はスケジュール表/カレンダーのスクリーンショットです。
含まれる全ての予定を抽出して、必ず以下のJSON形式「のみ」で回答してください。説明文・コードブロック・他の文字は絶対に含めないでください。

出力フォーマット:
{"events":[{"date":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","title":"予定名"}]}

制約:
- 日付が「4/23」のように年がない場合は ${currentYear} 年として扱う。ただし現在が${currentMonth}月で画像の月が大きく過去なら翌年とみなす。
- 時刻は24時間表記の "HH:MM"
- タイトルは絵文字・🔒・🔁・⚠️・📗・🎾などの装飾アイコンを全て除去し、純粋なテキストのみ
- 同じ日に複数予定があればそれぞれ別エントリとして出力
- 読み取れない予定は出力しない
- 全日予定や時刻不明な予定はスキップ`;

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + encodeURIComponent(apiKey);
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64Data } }
        ]
      }],
      generationConfig: {
        temperature: 0.1,
        responseMimeType: 'application/json'
      }
    })
  });

  if (!res.ok) {
    const txt = await res.text();
    throw new Error('API応答エラー (' + res.status + '): ' + txt.substring(0, 200));
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (_) {
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('JSONが取得できませんでした: ' + text.substring(0, 200));
    parsed = JSON.parse(m[0]);
  }
  const list = Array.isArray(parsed.events) ? parsed.events : [];
  return list.filter(ev => ev && ev.date && ev.start && ev.end && ev.title);
}

function showExtractedPreview(extracted) {
  document.getElementById('ai-loading').style.display = 'none';
  const previewEl = document.getElementById('ai-step-preview');
  previewEl.style.display = 'flex';

  const list = document.getElementById('ai-extracted-list');
  list.innerHTML = '';

  const items = extracted
    .map(ev => ({ ...ev, title: (ev.title || '').trim(), exists: eventAlreadyExists(ev) }))
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));

  aiExtractedItems = items;

  const newCount = items.filter(i => !i.exists).length;
  const existCount = items.length - newCount;
  document.getElementById('ai-summary').innerText =
    `${items.length}件検出  /  新規 ${newCount}件  /  既存 ${existCount}件`;

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.style.padding = '20px';
    empty.style.textAlign = 'center';
    empty.style.color = '#9CA3AF';
    empty.innerText = '予定を読み取れませんでした';
    list.appendChild(empty);
    return;
  }

  items.forEach((ev, idx) => {
    const row = document.createElement('label');
    row.className = 'ai-event-row' + (ev.exists ? ' exists' : '');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = !ev.exists;
    checkbox.disabled = ev.exists;
    checkbox.dataset.idx = idx;

    const dateSpan = document.createElement('span');
    dateSpan.className = 'ai-date';
    dateSpan.innerText = ev.date.replace(/^\d{4}-/, '').replace('-', '/');

    const timeSpan = document.createElement('span');
    timeSpan.className = 'ai-time';
    timeSpan.innerText = `${ev.start}–${ev.end}`;

    const titleSpan = document.createElement('span');
    titleSpan.className = 'ai-title';
    titleSpan.innerText = ev.title;

    row.appendChild(checkbox);
    row.appendChild(dateSpan);
    row.appendChild(timeSpan);
    row.appendChild(titleSpan);

    if (ev.exists) {
      const tag = document.createElement('span');
      tag.className = 'ai-exists-tag';
      tag.innerText = '既存';
      row.appendChild(tag);
    }

    list.appendChild(row);
  });
}

function eventAlreadyExists(ev) {
  const startVal = parseTimeInput(ev.start);
  const normTitle = (ev.title || '').trim();
  return events.some(e =>
    e.type === 0 &&
    e.dateStr === ev.date &&
    Math.abs(e.start - startVal) < 0.01 &&
    (e.title || '').trim() === normTitle
  );
}

function confirmAddEvents() {
  const list = document.getElementById('ai-extracted-list');
  const checkboxes = list.querySelectorAll('input[type="checkbox"]');
  let added = 0;
  checkboxes.forEach(cb => {
    if (!cb.checked || cb.disabled) return;
    const ev = aiExtractedItems[parseInt(cb.dataset.idx)];
    if (!ev) return;
    const startVal = parseTimeInput(ev.start);
    const endVal = parseTimeInput(ev.end);
    let duration = endVal - startVal;
    if (duration <= 0) duration = 0.5;
    if (startVal < 0 || startVal >= 24) return;

    const colorIdx = 4; // 紫 = AI取込を識別しやすく
    const newEv = new Event(ev.date, startVal, duration, ev.title, colorIdx, 0);
    newEv.memo = '🤖 AI画像取込で追加';
    addEventWithAutoActual(newEv);
    added++;
  });
  saveData();
  closeAIImportModal();
  if (added > 0) {
    alert(added + '件の予定を追加しました');
  } else {
    alert('追加する予定がありませんでした');
  }
}
</script>
</body>
</html>
